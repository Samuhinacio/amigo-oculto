<style>

/* Tela de quem recebe o link */

.gift .lid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;transform:translateX(-50%);background:var(--gold)}

.gift .bow::before,.gift .bow::after{content:"";position:absolute;top:0;width:28px;height:24px;border:6px solid var(--gold);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}

.btn.huge{font-size:21px;min-height:64px;padding:16px 20px;width:100%;border-radius:16px}
.btn.yes{background:var(--ok);color:#fff}

.btn.no{background:#fff;color:var(--ink);border:2px solid var(--line)}

.btn.next{background:var(--gold);color:var(--pine)}
.pop{animation:rise .6s ease both}
.small-name{font-size:clamp(30px,8vw,40px)}
.alert{width:100%;background:#fff3d6;border:2px solid var(--gold);border-radius:14px;padding:14px 16px;text-align:left;font-size:18px;display:flex;flex-direction:column;gap:4px}
.alert-title{font-weight:800;color:#7a5a12;text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.big-facts{font-size:17px;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}

.modal-bg{position:fixed;inset:0;background:rgba(6,20,16,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.modal .row{justify-content:flex-end}
.pairs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:16px}

.pairs span{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:60}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<script>
"use strict";
/* Link público desta página. Pode ser trocado em "Link da página" na tela de envio. */
const DEFAULT_URL = "https://claude.ai/artifact/JYHNy4WbdFvnNbRPnYx66F";
const STORE = "amigo-oculto-familia-v1";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- Código do link (sem servidor: o resultado viaja embaralhado no próprio link) ---------- */
const ALPHA = "abcdefghijkmnpqrstuvwxyz23456789";
function b32enc(bytes){
  let bits = 0, val = 0, out = "";
  for (const b of bytes){
    val = (val << 8) | b; bits += 8;
    while (bits >= 5){ out += ALPHA[(val >>> (bits - 5)) & 31]; bits -= 5; }
    val &= (1 << bits) - 1;
  }
  if (bits > 0) out += ALPHA[(val << (5 - bits)) & 31];
  return out;
}
function b32dec(str){
  const out = []; let bits = 0, val = 0;
  for (const ch of str){
    const i = ALPHA.indexOf(ch);
    if (i < 0) throw new Error("caractere inválido");
    val = (val << 5) | i; bits += 5;
    if (bits >= 8){ out.push((val >>> (bits - 8)) & 255); bits -= 8; val &= (1 << bits) - 1; }
  }
  return new Uint8Array(out);
}
function fnv16(bytes){
  let h = 0x811c9dc5;
  for (const b of bytes){ h ^= b; h = Math.imul(h, 0x01000193) >>> 0; }
  return (h ^ (h >>> 16)) & 0xffff;
}
function keystream(s0, s1, len){
  let a = ((((s0 << 8) | s1) * 2654435761) ^ 0x6f1c3a5d) >>> 0;
  const out = new Uint8Array(len);
  for (let i = 0; i < len; i++){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    out[i] = ((t ^ (t >>> 14)) >>> 0) & 255;
  }
  return out;
}
const SEP = "\u001e";
function randBytes(n){
  const a = new Uint8Array(n);
  try { crypto.getRandomValues(a); } catch(e){ for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); }
  return a;
}
function pack(data, ver){
  const h = fnv16(data);
  const body = new Uint8Array(data.length + 2);
  body.set(data); body[data.length] = h >> 8; body[data.length + 1] = h & 255;
  const salt = randBytes(2);
  const ks = keystream(salt[0], salt[1], body.length);
  const out = new Uint8Array(body.length + 3);
  out[0] = ver; out[1] = salt[0]; out[2] = salt[1];
  for (let i = 0; i < body.length; i++) out[i + 3] = body[i] ^ ks[i];
  return b32enc(out);
}
function unpack(str, ver){
  let bytes;
  try { bytes = b32dec(str); } catch(e){ return null; }
  if (bytes.length < 6 || bytes[0] !== ver) return null;
  const ks = keystream(bytes[1], bytes[2], bytes.length - 3);
  const body = bytes.slice(3).map((b, i) => b ^ ks[i]);
  const data = body.slice(0, -2);
  const h = (body[body.length - 2] << 8) | body[body.length - 1];
  return fnv16(data) === h ? data : null;
}
function makeCode(fields){
  const data = new TextEncoder().encode(fields.map(f => String(f ?? "").split(SEP).join(" ")).join(SEP));
  return "ao-" + pack(data, 1);
}
function makeMulti(drawId, ev, list){
  const o = { d: drawId, e: [ev.name, ev.date, ev.time, ev.place, ev.budget, ev.notes].map(x => String(x ?? "").trim()), p: list };
  return "am-" + pack(new TextEncoder().encode(JSON.stringify(o)), 3);
}
function readMulti(raw){
  const m = String(raw || "").match(/am-([a-z0-9]{8,})/i);
  if (!m) return null;
  const data = unpack(m[1].toLowerCase(), 3);
  if (!data) return null;
  try {
    const o = JSON.parse(new TextDecoder().decode(data));
    if (!o || !Array.isArray(o.p) || !o.p.length) return null;
    const [name, date, time, place, budget, notes] = o.e || [];
    return { drawId: o.d, name, date, time, place, budget, notes, people: o.p.map(a => ({ giver: a[0] || "", receiver: a[1] || "", hint: a[2] || "" })) };
  } catch(e){ return null; }
}
function findCode(raw){
  const m = String(raw || "").match(/ao-[a-z0-9]{8,}/i);
  return m ? m[0].toLowerCase() : null;
}
function readCode(raw){
  const code = findCode(raw);
  if (!code) return null;
  const data = unpack(code.slice(3), 1);
  if (!data) return null;
  const f = new TextDecoder().decode(data).split(SEP);
  if (f.length < 10) return null;
  const [drawId, name, date, time, place, budget, notes, giver, receiver, hint] = f;
  return { drawId, name, date, time, place, budget, notes, giver, receiver, hint };
}

/* ---------- Estado do organizador (fica só neste navegador) ---------- */
function sample(){
  return {
    example: true,
    event: { name: "Natal da Família 2026", date: "2026-12-24", time: "20:00", place: "Casa da vó Lúcia", budget: "100", notes: "Leve o presente embrulhado e com o nome de quem vai receber." },
    people: [
      { id: uid(), name: "Vó Lúcia", phone: "", group: "", hint: "" },
      { id: uid(), name: "Ana", phone: "", group: "", hint: "Adora plantas" },
      { id: uid(), name: "Pedro", phone: "", group: "", hint: "" },
      { id: uid(), name: "Tio Carlos", phone: "", group: "", hint: "Torce pro Palmeiras" },
      { id: uid(), name: "Mariana", phone: "", group: "", hint: "" },
      { id: uid(), name: "Júlia", phone: "", group: "", hint: "Livros de suspense" }
    ],
    draw: null, sent: {}, baseUrl: ""
  };
}
function sampleState(){
  const s = sample();
  s.people[0].via = s.people[1].id;
  return s;
}
function blank(){
  return { example: false, event: { name: "Amigo Oculto da Família", date: "2026-12-24", time: "", place: "", budget: "", notes: "" }, people: [], draw: null, sent: {}, baseUrl: state ? state.baseUrl : "", me: state ? state.me : "" };
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.event && Array.isArray(s.people)) return s; } catch(e){}
  return null;
}
let saveTimer = null;
function storeLocal(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }
function save(){
  state.updatedAt = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(storeLocal, 200);
  scheduleRemote();
}
let state = load() || sampleState();

/* ---------- Salvar na conta do Claude (mesma lista no celular e no computador) ---------- */
const TAB = uid();
const sync = { status: (window.claude && typeof window.claude.use === "function") ? "loading" : "local", ref: null, writing: false, again: false, timer: null, blocked: false, pendingRender: false };
const SYNC_TEXT = {
  loading: "Carregando da sua conta…",
  saving: "Salvando na sua conta…",
  saved: "Salvo na sua conta do Claude. Abre igual no celular e no computador.",
  local: "Salvo só neste aparelho. Entre na sua conta do Claude para ver a mesma lista no celular e no computador.",
  offline: "Sem conexão com a sua conta agora. As mudanças ficam neste aparelho por enquanto.",
  choose: "Escolha qual versão manter."
};
function setSyncStatus(st){
  sync.status = st;
  const el = document.getElementById("sync");
  if (el){ el.textContent = SYNC_TEXT[st] || ""; el.dataset.st = st; }
}
function scheduleRemote(){
  if (!sync.ref || sync.blocked) return;
  clearTimeout(sync.timer);
  setSyncStatus("saving");
  sync.timer = setTimeout(pushRemote, 800);
}
async function pushRemote(){
  if (!sync.ref || sync.blocked) return;
  if (sync.writing){ sync.again = true; return; }
  sync.writing = true;
  const body = JSON.parse(JSON.stringify(state));
  delete body.syncedAt;
  const at = state.updatedAt || Date.now();
  try {
    await sync.ref.set({ state: body, updatedAt: at, writer: TAB });
    state.syncedAt = at; storeLocal();
    setSyncStatus(sync.again ? "saving" : "saved");
  } catch(e){
    if (e && e.code === "unavailable" && !sync.retried){
      sync.retried = true;
      setTimeout(() => { sync.writing = false; pushRemote(); }, 1500 + Math.random() * 1500);
      return;
    }
    sync.ref = null;
    setSyncStatus("local");
  }
  sync.retried = false;
  sync.writing = false;
  if (sync.again){ sync.again = false; pushRemote(); }
}
function sig(s){ return JSON.stringify({ e: s.event, p: s.people, d: s.draw, x: s.sent }); }
function inOrganizerView(){ return !/^#?(ao|am|org)-/i.test(location.hash); }
function rerender(){
  if (!inOrganizerView()) return;
  const ae = document.activeElement;
  if (ae && app.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){ sync.pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => {
  if (!sync.pendingRender) return;
  setTimeout(() => {
    const ae = document.activeElement;
    if (ae && app.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    sync.pendingRender = false; rerender();
  }, 50);
});
function adopt(r){
  state = Object.assign({}, r.state, { syncedAt: r.updatedAt, updatedAt: r.updatedAt });
  storeLocal();
  setSyncStatus("saved");
  rerender();
}
function describeState(s){
  const n = (s.people || []).filter(p => (p.name || "").trim()).length;
  const d = s.draw ? `sorteio feito (nº ${s.draw.id})` : "sem sorteio ainda";
  const when = s.updatedAt ? new Date(s.updatedAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "data desconhecida";
  return `<b>${esc((s.event && s.event.name) || "Sem nome")}</b><br>${n} pessoas · ${d}<br><span class="muted small">Alterada em ${esc(when)}</span>`;
}
function askConflict(r){
  sync.blocked = true;
  setSyncStatus("choose");
  modal("Qual versão manter?", `
    <p>Este aparelho e a sua conta têm listas diferentes do amigo oculto. Escolha a que vale; a outra é descartada.</p>
    <div class="opt"><p class="eyebrow">Salva na sua conta</p><p>${describeState(r.state)}</p></div>
    <div class="opt"><p class="eyebrow">Neste aparelho</p><p>${describeState(state)}</p></div>`,
    [
      { label: "Manter a deste aparelho", run: () => { sync.blocked = false; state.updatedAt = Date.now(); storeLocal(); pushRemote(); } },
      { label: "Manter a da conta", cls: "primary", run: () => { sync.blocked = false; adopt(r); } }
    ], { sticky: true });
}
function onFirst(snap){
  const r = snap.exists ? snap.data() : null;
  if (!r || !r.state){
    if (!state.example) pushRemote(); else setSyncStatus("saved");
    return;
  }
  if (state.example || sig(r.state) === sig(state)){ adopt(r); return; }
  const dirty = !state.syncedAt || (state.updatedAt || 0) > state.syncedAt;
  if (!dirty){ adopt(r); return; }
  if (state.syncedAt && state.syncedAt === r.updatedAt){ pushRemote(); return; }
  askConflict(r);
}
function onRemote(snap){
  if (!snap.exists || sync.blocked) return;
  const r = snap.data();
  if (!r || !r.state || r.writer === TAB) return;
  if ((r.updatedAt || 0) <= (state.syncedAt || 0)) return;
  if ((state.updatedAt || 0) > (state.syncedAt || 0)) return; // há mudança local a caminho; a última gravação vale
  adopt(r);
}
async function connectSync(){
  if (!(window.claude && typeof window.claude.use === "function")){ setSyncStatus("local"); return; }
  let db = null, user = null, id = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch(e){}
  if (db && user){ try { id = await user.id(); } catch(e){} }
  if (!db || !id){ setSyncStatus("local"); return; }
  try { sync.ref = db.doc("data/users/" + id + "/amigo-oculto"); } catch(e){ setSyncStatus("local"); return; }
  setSyncStatus("loading");
  let first = true;
  const timer = setTimeout(() => { if (first) setSyncStatus("offline"); }, 10000);
  sync.ref.onSnapshot(snap => {
    if (first){
      if (snap.metadata.fromCache) return;
      first = false; clearTimeout(timer); onFirst(snap);
    } else if (!snap.metadata.hasPendingWrites){
      onRemote(snap);
    }
  }, () => { clearTimeout(timer); sync.ref = null; setSyncStatus("local"); });
}

/* ---------- Formatação ---------- */
function fmtDate(iso, withYear){
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  if (!y || !m || !d) return iso;
  const opts = { weekday: "long", day: "numeric", month: "long" };
  if (withYear) opts.year = "numeric";
  return new Date(y, m - 1, d).toLocaleDateString("pt-BR", opts);
}
function fmtMoney(v){
  const n = Number(String(v).replace(",", "."));
  if (!v || isNaN(n)) return String(v || "");
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: Number.isInteger(n) ? 0 : 2 });
}
function waPhone(p){
  let d = String(p || "").replace(/\D/g, "");
  if (!d) return "";
  d = d.replace(/^0+/, "");
  if (d.length === 10 || d.length === 11) d = "55" + d;
  return d.length >= 12 ? d : "";
}
function pageUrl(){ return String(state.baseUrl || DEFAULT_URL).split("#")[0].trim(); }
function whenText(ev){
  let s = fmtDate(ev.date, false);
  if (ev.time) s += (s ? " às " : "") + ev.time.replace(":", "h");
  return s;
}

/* ---------- Sorteio ---------- */
function shuffle(a){
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
function solve(ppl){
  const n = ppl.length;
  const ok = (i, j) => i !== j;
  const idx = [...Array(n).keys()];
  // 1) Tenta uma corrente única (ninguém troca presente entre si)
  for (let t = 0; t < 4000; t++){
    const p = shuffle(idx);
    let good = true;
    for (let k = 0; k < n; k++){ if (!ok(p[k], p[(k + 1) % n])){ good = false; break; } }
    if (good){
      const pairs = {};
      for (let k = 0; k < n; k++) pairs[ppl[p[k]].id] = ppl[p[(k + 1) % n]].id;
      return pairs;
    }
  }
  // 2) Qualquer sorteio válido
  const order = shuffle(idx), used = new Array(n).fill(false), res = new Array(n);
  let steps = 0;
  function bt(k){
    if (k === n) return true;
    if (++steps > 300000) return false;
    const i = order[k];
    for (const j of shuffle(idx)){
      if (!used[j] && ok(i, j)){
        used[j] = true; res[i] = j;
        if (bt(k + 1)) return true;
        used[j] = false;
      }
    }
    return false;
  }
  if (!bt(0)) return null;
  const pairs = {};
  for (let i = 0; i < n; i++) pairs[ppl[i].id] = ppl[res[i]].id;
  return pairs;
}
function byId(id){ return state.people.find(p => p.id === id); }
function host(p){
  let cur = p; const seen = new Set();
  while (cur && cur.via && !seen.has(cur.id)){
    seen.add(cur.id);
    const n = byId(cur.via);
    if (!n || n === p) break;
    cur = n;
  }
  return cur || p;
}
function effPhone(p){ return waPhone(host(p).phone); }
function phoneLabel(p){
  const h = host(p);
  if (h !== p) return `no celular de ${h.name || "outra pessoa"}${h.phone ? " · " + h.phone : ""}`;
  return p.phone || "";
}
function sendKey(p){ const ph = effPhone(p); return ph ? "tel:" + ph : "host:" + host(p).id; }
function sharedGroups(list){
  const map = {}, groups = [];
  list.forEach(p => { const k = sendKey(p); if (!map[k]){ map[k] = []; groups.push(map[k]); } map[k].push(p); });
  return groups;
}
function named(){ return state.people.filter(p => p.name.trim()); }
function checks(){
  const list = named();
  const out = [];
  if (list.length < 3) out.push({ k: "bad", t: `Adicione pelo menos 3 pessoas (agora: ${list.length}).` });
  else out.push({ k: "ok", t: `${list.length} pessoas na lista.` });
  const seen = {}, dups = new Set();
  list.forEach(p => { const k = p.name.trim().toLowerCase(); if (seen[k]) dups.add(p.name.trim()); seen[k] = true; });
  if (dups.size) out.push({ k: "bad", t: `Nome repetido: ${[...dups].join(", ")}. Use sobrenome ou apelido para diferenciar.` });
  sharedGroups(list).filter(g => g.length > 1).forEach(g => {
    out.push({ k: "ok", t: `Mesmo celular: ${g.map(p => p.name.trim()).join(" e ")}. Cada um recebe o próprio link.` });
  });
  const noPhone = list.filter(p => !effPhone(p)).length;
  if (noPhone && list.length) out.push({ k: "warn", t: noPhone === list.length ? "Ninguém tem WhatsApp cadastrado. Tudo bem: na hora de enviar, você escolhe o contato no WhatsApp." : `${noPhone} sem WhatsApp cadastrado. Na hora de enviar, você escolhe o contato no WhatsApp.` });
  return out;
}

function joinNames(a){ return a.length > 1 ? a.slice(0, -1).join(", ") + " e " + a[a.length - 1] : (a[0] || ""); }

/* ---------- Utilidades de interface ---------- */
let toastTimer;
function toast(t){
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}
function modal(title, bodyHtml, actions, opts){
  const sticky = !!(opts && opts.sticky);
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title">${esc(title)}</h2>${bodyHtml}<div class="row">${actions.map((a, i) => `<button type="button" class="btn ${a.cls || "ghost"}" data-i="${i}">${esc(a.label)}</button>`).join("")}</div></div>`;
  const close = () => { bg.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape" && !sticky) close(); };
  bg.addEventListener("click", e => {
    if (e.target === bg){ if (!sticky) close(); return; }
    const b = e.target.closest("button[data-i]");
    if (b){ const a = actions[+b.dataset.i]; close(); if (a.run) a.run(); }
  });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(bg);
  const first = bg.querySelector("textarea, button");
  if (first) first.focus();
  const ta = bg.querySelector("textarea");
  if (ta) ta.select();
}
async function copy(text, okMsg){
  try {
    await navigator.clipboard.writeText(text);
    toast(okMsg || "Copiado");
  } catch(e){
    modal("Copie o texto", `<p class="small muted">Toque e segure no texto abaixo e escolha Copiar.</p><textarea id="copy-box" readonly rows="10">${esc(text)}</textarea>`, [{ label: "Fechar", cls: "primary" }]);
  }
}

/* ---------- Ações ---------- */
function addPeople(entries){
  if (!entries.length) return;
  entries.forEach(e => state.people.push({ id: uid(), name: e.name, phone: e.phone || "", group: "", hint: "" }));
  save(); render();
}
function parsePaste(text){
  return text.split(/\n+/).map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/(\+?\d[\d\s().-]{7,}\d)/);
    let phone = "", name = l;
    if (m){ phone = m[1].trim(); name = l.replace(m[1], ""); }
    name = name.replace(/^[\s\-–•*\d.)]+(?=\D)/, "").replace(/[\s,;:\-–]+$/, "").trim();
    return { name, phone };
  }).filter(e => e.name);
}
function buildCodes(drawId, ev, ppl, pairs){
  const codes = {};
  ppl.forEach(p => {
    const r = ppl.find(x => x.id === pairs[p.id]);
    codes[p.id] = makeCode([drawId, (ev.name || "").trim(), ev.date, ev.time, (ev.place || "").trim(), ev.budget, (ev.notes || "").trim(), p.name.trim(), r.name.trim(), (r.hint || "").trim()]);
  });
  return codes;
}

/* ---------- Convite para organizar junto ---------- */
function inviteCode(from){
  const ppl = state.people;
  const idx = id => ppl.findIndex(p => p.id === id);
  const o = { v: 1, from, ev: state.event, pp: ppl.map(p => [p.name, p.phone, p.group, p.hint, p.via ? idx(p.via) : -1]), url: state.baseUrl || "" };
  if (state.draw){
    const d = state.draw;
    o.d = { id: d.id, at: d.at, ev: d.event, pp: d.people.map(idx), pr: d.people.map(id => idx(d.pairs[id])), s: d.people.map(id => state.sent[id] ? 1 : 0) };
  }
  return "org-" + pack(new TextEncoder().encode(JSON.stringify(o)), 2);
}
function readInvite(h){
  const m = String(h || "").match(/org-([a-z0-9]{8,})/i);
  if (!m) return null;
  const data = unpack(m[1].toLowerCase(), 2);
  if (!data) return null;
  try {
    const o = JSON.parse(new TextDecoder().decode(data));
    if (!o || !o.ev || !Array.isArray(o.pp)) return null;
    if (o.d && (!Array.isArray(o.d.pp) || o.d.pp.some(i => !o.pp[i]) || o.d.pr.some(i => !o.pp[i]))) return null;
    return o;
  } catch(e){ return null; }
}
function applyInvite(o){
  const people = o.pp.map(a => ({ id: uid(), name: a[0] || "", phone: a[1] || "", group: a[2] || "", hint: a[3] || "", via: "" }));
  o.pp.forEach((a, i) => { if (typeof a[4] === "number" && people[a[4]] && a[4] !== i) people[i].via = people[a[4]].id; });
  let draw = null; const sent = {};
  if (o.d){
    const list = o.d.pp.map(i => people[i]);
    const pairs = {};
    o.d.pp.forEach((pi, k) => { pairs[people[pi].id] = people[o.d.pr[k]].id; if (o.d.s && o.d.s[k]) sent[people[pi].id] = true; });
    draw = { id: o.d.id, at: o.d.at, pairs, codes: buildCodes(o.d.id, o.d.ev, list, pairs), people: list.map(p => p.id), event: o.d.ev };
  }
  state = { example: false, event: o.ev, people, draw, sent, baseUrl: o.url || "", me: state.me || "", syncedAt: state.syncedAt };
  save(); storeLocal();
}
function inviteMessage(from){
  const name = (state.draw ? state.draw.event.name : state.event.name) || "da família";
  return [
    `Oi! Quero sua ajuda para organizar o amigo oculto *${name}*.`,
    "",
    "Toque no link para receber a lista no seu celular" + (state.draw ? " e me ajudar a enviar os links do sorteio:" : ":"),
    `${pageUrl()}#${inviteCode(from)}`,
    "",
    "⚠️ Este link é só para quem organiza. Não repasse para a família."
  ].join("\n");
}
function openInvite(){
  const meEl = document.getElementById("me");
  const from = (meEl ? meEl.value : state.me || "").trim();
  if (!from){
    const err = document.getElementById("me-err");

    return;
  }
  const msg = inviteMessage(from);
  modal("Convidar para organizar", `

    ${state.draw ? `<p class="small muted">Com essa cópia ela também consegue ver quem tirou quem. Convide só quem não participa ou é de total confiança.</p>` : ""}
    <a class="btn wa big" href="${esc("https://wa.me/?text=" + encodeURIComponent(msg))}" target="_blank" rel="noopener">Enviar convite no WhatsApp</a>
    <button type="button" class="btn ghost" id="copy-invite">Copiar convite</button>`,
    [{ label: "Fechar" }]);
  const cb = document.getElementById("copy-invite");
  if (cb) cb.addEventListener("click", () => copy(msg, "Convite copiado"));
}

function doDraw(){
  const ppl = named();
  const btn = document.querySelector('[data-act="draw"]');
  const err = document.getElementById("draw-err");
  const pairs = solve(ppl);
  if (!pairs){
    err.hidden = false;
    err.textContent = "Não consegui fazer o sorteio. Confira a lista e tente de novo.";
    return;
  }
  if (btn){ btn.disabled = true; btn.textContent = "Sorteando…"; }
  const ev = { ...state.event };
  const drawId = b32enc(randBytes(3)).slice(0, 4).toUpperCase();
  const codes = buildCodes(drawId, ev, ppl, pairs);
  setTimeout(() => {
    state.draw = { id: drawId, at: Date.now(), pairs, codes, people: ppl.map(p => p.id), event: ev };
    state.sent = {};
    state.example = false;
    save(); render();
    const s = document.getElementById("send");
    if (s) s.scrollIntoView({ behavior: "smooth", block: "start" });
    toast("Sorteio feito!");
  }, 700);
}
function confirmRedo(editAfter){
  const anySent = Object.values(state.sent).some(Boolean);
  const body = `<p>${editAfter ? "Para mudar o evento ou a lista, o sorteio atual é descartado e você sorteia de novo." : "Um novo sorteio troca todos os pares."}</p>
    ${anySent ? `<p class="error">Você já enviou alguns links. Eles continuam abrindo o resultado antigo (sorteio nº ${esc(state.draw.id)}). Avise a família para usar só o link novo; o número do sorteio aparece no topo da página de cada um.</p>` : ""}`;
  modal(editAfter ? "Editar e sortear de novo?" : "Refazer o sorteio?", body, [
    { label: "Cancelar" },
    { label: editAfter ? "Editar" : "Refazer", cls: "primary", run: () => {
      state.draw = null; state.sent = {}; showPairs = false; save(); render();
      if (!editAfter) setTimeout(doDraw, 50);
    } }
  ]);
}
let showPairs = false;
function pairRows(){
  return state.draw.people.map(id => {
    const g = byId(id), r = byId(state.draw.pairs[id]);

function pairsSection(){

    ${showPairs ? `
      <ul class="pairs">${rows.map(x => `<li><b>${esc(x.giver)}</b><span>tirou</span><b>${esc(x.receiver)}</b></li>`).join("")}</ul>

function revealAll(){

  if (state.notPlaying) return go();

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.ev){ state.event[t.dataset.ev] = t.value; save(); }
  else if (t.dataset.f){
    const id = t.closest(".person").dataset.id;
    const p = state.people.find(x => x.id === id);
    if (p){ p[t.dataset.f] = t.value; save(); }
    if (t.dataset.f === "via"){ render(); return; }
    refreshDrawPanel();
  } else if (t.id === "me"){
    state.me = t.value; save();
    const err = document.getElementById("me-err"); if (err && t.value.trim()) err.hidden = true;
  } else if (t.id === "base-url"){
    state.baseUrl = t.value; save();
    document.querySelectorAll(".send-item").forEach(li => {
      const p = state.people.find(x => x.id === li.dataset.id);
      const a = li.querySelector("a.btn.wa"); if (p && a) a.href = waLink(p);
    });
    document.querySelectorAll('[data-act="wa-multi"]').forEach(a => {
      const g = a.dataset.ids.split(",").map(byId).filter(Boolean);
      if (g.length) a.href = waMultiLink(g);
    });

});
document.addEventListener("change", e => {

document.addEventListener("submit", e => {
  if (e.target.id === "add-form"){
    e.preventDefault();
    const inp = document.getElementById("add-name");
    const name = inp.value.trim();
    if (!name) return;
    addPeople([{ name }]);
    const again = document.getElementById("add-name");
    if (again) again.focus();
  }
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const item = el.closest("[data-id]");
  const person = item ? state.people.find(p => p.id === item.dataset.id) : null;
  switch (act){
    case "clear-example": state = blank(); save(); render(); break;
    case "remove":
      state.people = state.people.filter(p => p !== person);
      state.people.forEach(x => { if (person && x.via === person.id) x.via = ""; });
      save(); render(); break;
    case "wa-multi":
      el.dataset.ids.split(",").forEach(id => { state.sent[id] = true; });
      save(); setTimeout(render, 400);
      break;
    case "paste": {
      const ta = document.getElementById("paste");
      addPeople(parsePaste(ta.value));
      break;
    }
    case "draw": doDraw(); break;
    case "edit": confirmRedo(true); break;
    case "redo": confirmRedo(false); break;
    case "reveal-all":
    case "show-pairs": revealAll(); break;
    case "hide-pairs": showPairs = false; render(); break;
    case "copy-pairs": copy(pairsText(), "Lista copiada"); break;
    case "invite": openInvite(); break;
    case "join": {
      const o = readInvite(location.hash);
      if (o){ applyInvite(o); toast("Pronto! Agora você organiza junto."); }
      location.hash = "";
      break;
    }
    case "go-home": location.hash = ""; break;
    case "wa":
      if (person){ state.sent[person.id] = true; save(); setTimeout(render, 400); }
      break;
    case "copy-msg":
      if (person){ copy(personalMessage(person), `Mensagem de ${person.name} copiada`); state.sent[person.id] = true; save(); setTimeout(render, 400); }
      break;
    case "toggle-sent":
      if (person){ state.sent[person.id] = !state.sent[person.id]; save(); render(); }
      break;
    case "copy-group": copy(groupMessage(), "Aviso copiado"); break;
    case "preview": {
      const ev = state.draw.event;
      location.hash = makeCode([state.draw.id, ev.name, ev.date, ev.time, ev.place, ev.budget, ev.notes, "Fulano (exemplo)", "Pessoa sorteada", "Aqui aparece a dica de presente, se houver"]);
      break;
    }
    case "open-code": {
      const raw = document.getElementById("code-in").value;
      const code = findCode(raw);
      const inv = String(raw || "").match(/org-[a-z0-9]{8,}/i);
      const multi = String(raw || "").match(/am-[a-z0-9]{8,}/i);
      if (code && readCode(code)) location.hash = code;
      else if (multi && readMulti(multi[0])) location.hash = multi[0].toLowerCase();
      else if (inv && readInvite(inv[0])) location.hash = inv[0].toLowerCase();
      else document.getElementById("code-err").hidden = false;
      break;
    }
  }
});

/* ---------- Tela de quem recebe o link ---------- */
const SEEN = "amigo-oculto-visto";
function seenKey(d, p){ return (d.drawId || "") + "|" + String(p.giver || "").trim().toLowerCase(); }
function wasSeen(d, p){ try { return !!(JSON.parse(localStorage.getItem(SEEN) || "{}")[seenKey(d, p)]); } catch(e){ return false; } }
function markSeen(d, p){
  try { const m = JSON.parse(localStorage.getItem(SEEN) || "{}"); m[seenKey(d, p)] = Date.now(); localStorage.setItem(SEEN, JSON.stringify(m)); } catch(e){}
}
function renderReveal(d){
  const isPreview = d.people.some(p => p.giver === "Fulano (exemplo)");
  const many = d.people.length > 1;
  let i = 0;
  const facts = [["Quando", [fmtDate(d.date, true), d.time ? d.time.replace(":", "h") : ""].filter(Boolean).join(", às ")], ["Onde", d.place], ["Valor", d.budget ? "até " + fmtMoney(d.budget) : ""], ["Recado", d.notes]].filter(r => r[1]);
  const factsHtml = facts.length ? `<dl class="facts big-facts">${facts.map(r => `<dt>${r[0]}</dt><dd class="${r[0] === "Recado" ? "notes" : ""}">${esc(r[1])}</dd>`).join("")}</dl>` : "";
  const nextBtn = label => many ? `<button type="button" class="btn huge next" data-go="next">${label}</button>` : "";
  function shell(inner){
    app.innerHTML = `
      <header class="mini-head">
        <p class="eyebrow">Amigo Oculto · sorteio nº ${esc(d.drawId)}</p>
        <p class="mini-title">${esc(d.name || "Amigo Oculto")}</p>
      </header>
      ${isPreview ? `<div class="banner"><p><b>Pré-visualização.</b> É assim que cada pessoa vê o próprio link.</p><button type="button" class="btn" id="back">Voltar ao sorteio</button></div>` : ""}
      <section class="card simple" aria-live="polite">${inner}</section>`;
    app.querySelectorAll("[data-go]").forEach(btn => btn.addEventListener("click", () => {
      const go = btn.dataset.go;
      if (go === "yes") (!isPreview && wasSeen(d, d.people[i])) ? already() : confirmMe();
      else if (go === "show") (!isPreview && wasSeen(d, d.people[i])) ? already() : show();
      else if (go === "done") done();
      else if (go === "notme") notMe();
      else if (go === "next"){ i = (i + 1) % d.people.length; ask(); }
      else ask();
      window.scrollTo(0, 0);
    }));
    const back = document.getElementById("back");
    if (back) back.addEventListener("click", () => { location.hash = ""; });
    const first = app.querySelector(".simple .btn");
    if (first) first.focus({ preventScroll: true });
  }
  function ask(){
    const p = d.people[i];
    shell(`
      ${many ? `<p class="count">Pessoa ${i + 1} de ${d.people.length}</p>` : ""}
      <p class="q-label">Você é</p>
      <p class="q-name">${esc(p.giver)}?</p>
      <div class="big-btns">
        <button type="button" class="btn huge yes" data-go="yes">Sim, sou eu</button>
        <button type="button" class="btn huge no" data-go="notme">Não</button>
        ${nextBtn("Ver próxima pessoa →")}
      </div>`);
  }
  function confirmMe(){
    const p = d.people[i];
    shell(`
      <p class="q-label">Tem certeza que é você,</p>
      <p class="q-name">${esc(p.giver)}?</p>
      <div class="alert" role="alert">
        <p class="alert-title">Atenção</p>
        <p>O nome do seu amigo oculto vai aparecer <b>só uma vez</b>. Leia com calma. Depois que fechar, não dá para ver de novo neste celular.</p>
      </div>
      <div class="big-btns">
        <button type="button" class="btn huge yes" data-go="show">Sim, tenho certeza</button>
        <button type="button" class="btn huge no" data-go="notme">Não sou eu</button>
      </div>`);
  }
  function already(){
    const p = d.people[i];
    shell(`
      <p class="q-name small-name">${esc(p.giver)}, você já viu quem tirou.</p>
      <p class="say">O nome aparece só uma vez. Se você esqueceu, fale com quem organizou o sorteio.</p>
      <div class="big-btns">
        ${nextBtn("Ver próxima pessoa →")}
        <button type="button" class="btn huge no" data-go="ask">Voltar</button>
      </div>`);
  }
  function done(){
    const p = d.people[i];
    shell(`
      <p class="q-name small-name">Pronto, ${esc(p.giver)}!</p>
      <p class="say">Agora é segredo. Bom amigo oculto!</p>
      ${many ? `<div class="big-btns">${nextBtn("Passar para a próxima pessoa →")}</div>` : ""}`);
  }
  function notMe(){
    const p = d.people[i];
    shell(`
      <p class="q-label">Este presente é de</p>
      <p class="q-name">${esc(p.giver)}</p>
      <p class="say">Entregue o celular para ${esc(p.giver)}, sem olhar.</p>
      <div class="big-btns">
        <button type="button" class="btn huge yes" data-go="yes">Agora sou eu, ${esc(p.giver)}</button>
        ${nextBtn("Ver próxima pessoa →")}
        <button type="button" class="btn huge no" data-go="ask">Voltar</button>
      </div>`);
  }
  function show(){
    const p = d.people[i];
    if (!isPreview) markSeen(d, p);
    shell(`
      <p class="q-label">${esc(p.giver)}, você tirou:</p>
      <p class="drawn pop">${esc(p.receiver)}</p>
      ${p.hint ? `<p class="hint"><b>Dica de presente:</b> ${esc(p.hint)}</p>` : ""}
      ${factsHtml}
      <p class="say small-say">Guarde segredo! Este nome não aparece de novo.</p>
      <div class="big-btns">
        <button type="button" class="btn huge no" data-go="done">Pronto, já guardei</button>
      </div>`);
  }
  ask();
}
function renderInvalid(){
  app.innerHTML = `
    <header class="hero"><div class="ribbon" aria-hidden="true"></div><p class="eyebrow">Amigo Oculto</p><h1>Este link está incompleto</h1></header>
    <section class="card">
      <p>O link pode ter sido cortado ao copiar. Peça para quem organizou enviar de novo, ou cole aqui a mensagem inteira que você recebeu.</p>
      <label for="code-in">Mensagem ou link<input id="code-in" autocomplete="off"></label>
      <button type="button" class="btn primary" data-act="open-code">Ver meu resultado</button>
      <p class="error" id="code-err" hidden>Ainda não encontrei um código válido. Confira se copiou a mensagem inteira.</p>
      <p class="small"><a href="#">Ir para a página de organizar</a></p>
    </section>`;
}

function renderInvite(o){
  const evName = (o.d ? o.d.ev.name : o.ev.name) || "Amigo Oculto";
  const total = o.d ? o.d.pp.length : o.pp.filter(a => (a[0] || "").trim()).length;
  const sentN = o.d && o.d.s ? o.d.s.filter(Boolean).length : 0;
  const hasLocal = !state.example && state.people.some(p => p.name.trim());
  app.innerHTML = `
    <header class="hero">
      <div class="ribbon" aria-hidden="true"></div>
      <p class="eyebrow">Convite para organizar</p>
      <h1>${esc(evName)}</h1>
    </header>
    <section class="card">
      <p class="hello">${esc(o.from || "Alguém")} quer organizar o amigo oculto com você.</p>
      <dl class="facts">
        <dt>Participantes</dt><dd>${total} pessoas</dd>
        <dt>Sorteio</dt><dd>${o.d ? `Feito, nº ${esc(o.d.id)} · ${sentN} de ${total} links enviados` : "Ainda não foi feito"}</dd>
      </dl>
      ${hasLocal ? `<p class="error">Este celular já tem um amigo oculto salvo (${esc(state.event.name || "sem nome")}). Ao entrar, ele é substituído por este.</p>` : ""}
      <button type="button" class="btn primary big" data-act="join">Entrar na organização</button>
      <button type="button" class="btn ghost" data-act="go-home">Agora não</button>
      <p class="small muted">Cada celular guarda a sua cópia. Combinem quem envia o link para quem, porque a marcação de "enviado" não passa sozinha de um celular para o outro.</p>
    </section>`;
}

/* ---------- Rota ---------- */
function render(){
  const h = location.hash.replace(/^#/, "");
  if (/^ao-/i.test(h)){
    const c = readCode(h);
    c ? renderReveal({ ...c, people: [{ giver: c.giver, receiver: c.receiver, hint: c.hint }] }) : renderInvalid();
  } else if (/^am-/i.test(h)){
    const d = readMulti(h);
    d ? renderReveal(d) : renderInvalid();
  } else if (/^org-/i.test(h)){
    const o = readInvite(h);
    o ? renderInvite(o) : renderInvalid();
  } else {
    renderOrganizer();
  }
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
connectSync();
</script>
</body>
</html>
